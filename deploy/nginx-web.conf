# TS Minicab web app — nginx server block for the same VPS as the backend
# and the main tsminicab.com site. Serves the static Flutter web build as
# its own subdomain; doesn't touch the backend's own nginx config or
# process, and none is needed on the backend either — its CORS is already
# wide open (confirmed live before writing this file).
#
# Replace WEBAPP_SUBDOMAIN below with whatever you choose (e.g.
# app.tsminicab.com) before using this file — see deploy/WEB_DEPLOY.md for
# the full walkthrough, including the certbot command that fills in the
# SSL block below automatically.

server {
    listen 80;
    listen [::]:80;
    server_name WEBAPP_SUBDOMAIN;

    root /var/www/ts-minicab-web;
    index index.html;

    # Flutter's web build is a single-page app — any path that isn't a real
    # file falls back to index.html so in-app routing (go_router) works on
    # a hard refresh or a direct link, not just in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # flutter_service_worker.js must never be cached, or a new deploy won't
    # actually reach returning visitors until the cache expires.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    # Everything else Flutter emits is content-hashed (main.dart.js, assets/,
    # canvaskit/) — safe to cache aggressively since a new build gets new
    # filenames automatically.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|json)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain application/javascript application/json text/css application/wasm;
}
