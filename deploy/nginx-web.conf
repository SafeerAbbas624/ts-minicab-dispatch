# TS Minicab web app — nginx server block for the same VPS as the backend
# and the main tsminicab.com site. Serves the static Flutter web build as
# its own subdomain; doesn't touch the backend's own nginx config or
# process, and none is needed on the backend either — its CORS is already
# wide open (confirmed live before writing this file).
#
# Replace WEBAPP_SUBDOMAIN below with whatever you choose (e.g.
# app.tsminicab.com) before using this file — see deploy/WEB_DEPLOY.md for
# the full walkthrough, including the certbot command that fills in the
# SSL block below automatically.

server {
    listen 80;
    listen [::]:80;
    server_name WEBAPP_SUBDOMAIN;

    root /var/www/ts-minicab-web;
    index index.html;

    # Flutter's web build is a single-page app — any path that isn't a real
    # file falls back to index.html so in-app routing (go_router) works on
    # a hard refresh or a direct link, not just in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Corrected 26 Aug — the original version of this file wrongly cached
    # these under the aggressive rule below, on the mistaken assumption
    # Flutter web output is content-hashed like a typical webpack build.
    # It isn't: main.dart.js, flutter.js, and flutter_bootstrap.js keep
    # fixed filenames across builds, so an "immutable, cache for a year"
    # header on them means a redeploy never reaches a returning visitor (or
    # any CDN sitting in front) until that year is up — this is what
    # actually caused a reported blank page, not a build artifact issue;
    # confirmed by diffing the live-served files byte-for-byte against a
    # fresh local build and finding them identical.
    location ~* ^/(main\.dart\.js|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-cache";
    }

    # canvaskit/ and assets/ *are* safe to cache long-term — canvaskit's own
    # filenames are versioned by the Flutter engine build, and asset files
    # only change when their own content does.
    location ~* \.(?:wasm|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain application/javascript application/json text/css application/wasm;
}
